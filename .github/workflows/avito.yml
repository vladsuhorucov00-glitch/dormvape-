name: Avito monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run monitor
        run: node avito-monitor/monitor.js
        env:
          AVITO_BOT_TOKEN: ${{ secrets.AVITO_BOT_TOKEN }}
          AVITO_CHAT_ID: ${{ secrets.AVITO_CHAT_ID }}

      - name: Save seen + status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avito-monitor/
          git diff --cached --quiet || (git commit -m "avito: update data" && git push)
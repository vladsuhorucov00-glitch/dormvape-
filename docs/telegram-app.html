<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DormVape</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #0a0a0a);
    color: var(--tg-theme-text-color, #e0e0e0);
    padding: 16px 12px 24px;
    min-height: 100vh;
}
h1 {
    font-size: 22px; font-weight: 700; color: var(--tg-theme-text-color, #fff);
    text-align: center; margin-bottom: 4px;
}
.sub { font-size: 13px; color: var(--tg-theme-hint-color, #888); text-align: center; margin-bottom: 20px; }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
.cat { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--tg-theme-button-color, rgba(255,255,255,0.1)); background: transparent; color: var(--tg-theme-text-color, #ccc); font-size: 13px; cursor: pointer; flex-shrink: 0; }
.cat.active { background: var(--tg-theme-button-color, #5288c1); color: var(--tg-theme-button-text-color, #fff); border-color: var(--tg-theme-button-color, #5288c1); }
.products { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.card {
    padding: 14px; border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, rgba(255,255,255,0.04));
    border: 1px solid var(--tg-theme-section-separator-color, rgba(255,255,255,0.06));
}
.card-title { font-size: 15px; font-weight: 600; color: var(--tg-theme-text-color, #fff); }
.card-price { font-size: 14px; color: var(--tg-theme-accent-text-color, #aaa); margin-top: 4px; }
.card-ohm { font-size: 12px; color: var(--tg-theme-hint-color, #666); margin-top: 2px; }
.btn {
    width: 100%; padding: 14px; margin-top: 24px; border: 0; border-radius: 10px;
    background: var(--tg-theme-button-color, #5288c1);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 16px; font-weight: 600; cursor: pointer;
}
.btn:active { opacity: 0.8; }
</style>
</head>
<body>
<h1>DormVape</h1>
<p class="sub">Жидкости и испарители для POD</p>
<div class="cats" id="cats"></div>
<div class="products" id="products"></div>
<button class="btn" id="contact-btn">Связаться с нами</button>
<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const chatId = '940542505';
const products = [
    { id: 1, name: 'HQD Crisp Apple 50мл', price: '700₽', cat: 'liquids', ohm: null },
    { id: 2, name: 'HQD Blueberry Ice 50мл', price: '700₽', cat: 'liquids', ohm: null },
    { id: 3, name: 'HQD Strawberry 50мл', price: '700₽', cat: 'liquids', ohm: null },
    { id: 4, name: 'HQD Mint 50мл', price: '700₽', cat: 'liquids', ohm: null },
    { id: 5, name: 'HQD Mango 50мл', price: '700₽', cat: 'liquids', ohm: null },
    { id: 6, name: 'HQD Peach 50мл', price: '700₽', cat: 'liquids', ohm: null },
    { id: 7, name: 'SMOK RPM 2', price: '800₽', cat: 'coils', ohm: '0.6 / 0.8 / 1.0' },
    { id: 8, name: 'SMOK LP 1', price: '800₽', cat: 'coils', ohm: '0.6 / 1.0 / 1.2' },
    { id: 9, name: 'Vaporesso GTX', price: '700₽', cat: 'coils', ohm: '0.6 / 0.8 / 1.0 / 1.2' },
    { id: 10, name: 'Lost Vape UB Lite', price: '700₽', cat: 'coils', ohm: '0.6 / 0.8 / 1.0' },
];

const cats = [
    { id: 'all', name: 'Все' },
    { id: 'liquids', name: 'Жидкости' },
    { id: 'coils', name: 'Испарители' },
];

let activeCat = 'all';

function renderCats() {
    document.getElementById('cats').innerHTML = cats.map(c =>
        `<button class="cat${c.id === activeCat ? ' active' : ''}" data-cat="${c.id}">${c.name}</button>`
    ).join('');
    document.querySelectorAll('.cat').forEach(el => {
        el.addEventListener('click', () => {
            activeCat = el.dataset.cat;
            renderCats();
            renderProducts();
        });
    });
}

function renderProducts() {
    const filtered = activeCat === 'all' ? products : products.filter(p => p.cat === activeCat);
    document.getElementById('products').innerHTML = filtered.map(p => `
        <div class="card">
            <div class="card-title">${p.name}</div>
            ${p.price ? `<div class="card-price">${p.price}</div>` : ''}
            ${p.ohm ? `<div class="card-ohm">${p.ohm} Ω</div>` : ''}
        </div>
    `).join('');
}

document.getElementById('contact-btn').addEventListener('click', () => {
    tg.openTelegramLink('https://t.me/dormvapenft');
});

renderCats();
renderProducts();
</script>
</body>
</html>
